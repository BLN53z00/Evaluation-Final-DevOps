name: Test fonctionnel

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  functional-test:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
          MARIADB_DATABASE: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASSWORD: ""
      DB_NAME: test

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Installation des dépendances
        run: pip install -r requirements.txt

      - name: Démarrage de l'application
        run: nohup python app.py > app.log 2>&1 &

      - name: Exécution du test fonctionnel
        run: python tests/functional_test.py

      - name: Affichage des logs en cas d'échec
        if: failure()
        run: cat app.log